# VisTW-Dialogue 階段 1：生成
#
# 兩階段評測的第一步——送圖片與問題，記錄模型的自由回答。
# 跑完後用 scripts/build_vistw_judge_dataset.py 產生階段 2 的資料集，
# 再以 vistw_judge.yaml（vistw_judge）評分。
#
# ⚠️ 本階段的 accuracy 是「回應產生率」而非正確率——開放式問答沒有單一正解，
#    品質由階段 2 的 judge 評 0–10 分。

llm_api:
  base_url: "http://your-openai-compatible-server/v1"
  api_key: "your-api-key"
  api_rate_limit: -1
  max_retries: 3
  timeout: 600

model:
  name: "model-under-test"
  temperature: 0.0
  top_p: 0.9
  max_tokens: 2048        # 自由問答需要較長輸出
  extra_body:

evaluation:
  dataset_paths:
    - "datasets/example/vistw_dialogue/"
  evaluation_method: "vistw_dialogue"
  repeat_runs: 1
  shuffle_options: false

  strategy_config:
    image_field: "image_path"
    max_image_size: null
    image_detail: "auto"

logging:
  level: "INFO"
