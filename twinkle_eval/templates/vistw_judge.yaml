# VisTW-Dialogue 階段 2：評分
#
# 讀階段 1 產生的評分資料集（由 scripts/build_vistw_judge_dataset.py 組成），
# 由 judge 模型依官方評分指南給 0–10 分。
#
# model.name 這裡填的是 **judge 模型**，不是被評測的模型。
#
# 指標：
#   avg_judge_score  ← 真正的指標（0–10 平均分）
#   accuracy         ← 及格率（預設門檻 6.0），輔助參考
#   unparsed_rate    ← judge 回應無法解析的比例；明顯大於 0 代表 judge
#                       沒有遵守輸出格式，此時平均分的母體會縮小，需一併回報

llm_api:
  base_url: "http://your-openai-compatible-server/v1"
  api_key: "your-api-key"
  api_rate_limit: -1
  max_retries: 3
  timeout: 600

model:
  name: "judge-model"
  # 官方對每個回答評分 5 次（temperature 0.7）取平均。
  # 本專案以 repeat_runs: 5 達成，並額外得到標準差——
  # judge 自身的變異因此可見，那正是分數對比時需要的雜訊下界。
  temperature: 0.7
  top_p: 0.9
  max_tokens: 1024
  extra_body:

evaluation:
  dataset_paths:
    - "datasets/example/vistw_dialogue/judge.jsonl"
  evaluation_method: "vistw_judge"
  repeat_runs: 5
  shuffle_options: false

  strategy_config:
    vistw_judge_pass_threshold: 6.0   # accuracy 的及格線；不影響 avg_judge_score

logging:
  level: "INFO"
