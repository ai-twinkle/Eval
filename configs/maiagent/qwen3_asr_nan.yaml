# MaiAgent ASR Eval — Qwen3-ASR × TAT S2ST（台語/閩南語）
#
# 測試 Qwen3-ASR 對台語閩南語的辨識能力（非主力台語模型，用作交叉比較）
# 部署：DashScope 國際版
# 需要：export DASHSCOPE_API_KEY=<your-key>

llm_api:
  type: "dashscope_asr"
  base_url: "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  api_key: "${DASHSCOPE_API_KEY}"
  api_rate_limit: 5
  max_retries: 4
  timeout: 180

model:
  name: "qwen3-asr-flash-2026-02-10"
  temperature: 0.0

evaluation:
  dataset_paths:
    - "datasets/tat_s2st/test_100.jsonl"
  evaluation_method: "asr"
  strategy_config:
    asr_language: "nan"
    asr_metric: "cer"
    remove_punctuation: true
    to_lower: true
    normalize_unicode: true
    strip_tone_marks: true
