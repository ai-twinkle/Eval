# MaiAgent ASR Eval — Qwen-Omni-Turbo × FLEURS cmn_hans_cn（普通話，大陸口音）
#
# Qwen3.5-Omni arXiv:2509.17765
# 部署：DashScope 國際版 (Chat Completions 多模態模式)
# 需要：export DASHSCOPE_API_KEY=<your-key>
#
# ⚠️  FLEURS 僅有 cmn_hans_cn（簡體，大陸口音），無 zh-TW variant
# reference 為簡體中文 → 不需要 OpenCC 轉換
# 先執行：python scripts/download_fleurs_cmn_hans_cn.py

llm_api:
  type: "qwen_omni"
  base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  api_rate_limit: -1  # FLEURS 音檔大（~700KB），建議本機跑時改 0.5 避免 429
  max_retries: 3
  timeout: 300

model:
  name: "qwen-omni-turbo"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  extra_body: {}

evaluation:
  dataset_paths:
    - "datasets/fleurs_cmn_hans_cn/test_100.jsonl"
  evaluation_method: "asr"
  strategy_config:
    asr_language: "zh"
    asr_metric: "cer"
    remove_punctuation: true
    to_lower: true
    normalize_unicode: true
