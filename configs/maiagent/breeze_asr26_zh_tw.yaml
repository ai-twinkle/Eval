# MaiAgent ASR Eval — Breeze ASR 26 × CommonVoice zh-TW（國語）
#
# Breeze ASR 26 arXiv:2603.19259  https://hf.co/MediaTek-Research/Breeze-ASR-26
# 部署：NCHC Taiwan AI RAP  model_id=Breeze-ASR-26
# 需要：export NCHC_RAP_API_KEY=<your-key>

llm_api:
  type: "whisper"
  base_url: "https://portal.genai.nchc.org.tw/api/v1"
  api_key: "${NCHC_RAP_API_KEY}"
  api_rate_limit: -1
  max_retries: 3
  timeout: 120

model:
  name: "Breeze-ASR-26"
  temperature: 0.0

evaluation:
  dataset_paths:
    - "datasets/cv_zh_tw/test.jsonl"
  evaluation_method: "asr"
  strategy_config:
    asr_language: "zh"
    asr_metric: "cer"
    remove_punctuation: true
    to_lower: true
    normalize_unicode: true
