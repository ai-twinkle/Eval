# MaiAgent ASR Eval — Qwen3-ASR × CommonVoice zh-TW（國語）
#
# Qwen3-ASR arXiv:2601.21337  https://github.com/QwenLM/Qwen3-ASR
# 部署：DashScope 國際版 (Alibaba Cloud International)
# 需要：export DASHSCOPE_API_KEY=<your-key>
#
# 注意：若 /v1/audio/transcriptions 不通，改 type: "openai" (Chat Completions 模式)
# DashScope model alias 確認: curl /v1/models | grep qwen3-asr

llm_api:
  type: "dashscope_asr"
  base_url: "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  api_key: "${DASHSCOPE_API_KEY}"
  api_rate_limit: 5
  max_retries: 4
  timeout: 180

model:
  name: "qwen3-asr-flash-2026-02-10"
  temperature: 0.0

evaluation:
  dataset_paths:
    - "datasets/cv_zh_tw/test_100.jsonl"
  evaluation_method: "asr"
  strategy_config:
    asr_language: "zh"
    asr_metric: "cer"
    remove_punctuation: true
    to_lower: true
    normalize_unicode: true
    opencc_convert: "s2tw"  # Qwen3-ASR-Flash 輸出簡體 → 轉繁體再比對
