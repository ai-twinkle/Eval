# MaiAgent ASR Eval — Qwen3-ASR-Flash × LibriSpeech test-clean（英文）
# 部署：DashScope 國際版

llm_api:
  type: "dashscope_asr"
  base_url: "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  api_key: "${DASHSCOPE_API_KEY}"
  api_rate_limit: 5
  max_retries: 4
  timeout: 180

model:
  name: "qwen3-asr-flash-2026-02-10"
  temperature: 0.0

evaluation:
  dataset_paths:
    - "datasets/librispeech_en/test_100.jsonl"
  evaluation_method: "asr"
  strategy_config:
    asr_language: "en"
    asr_metric: "wer"
    remove_punctuation: true
    to_lower: true
    normalize_unicode: true
